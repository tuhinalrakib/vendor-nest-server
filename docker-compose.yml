services:
  # 1. PostgreSQL Database Container (Self-Contained DB)
  db:
    image: postgres:15-alpine
    container_name: vendornest_postgres
    restart: always
    environment:
      POSTGRES_DB: vendornest_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Celery Broker Container
  redis:
    image: redis:7-alpine
    container_name: vendornest_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Django Backend REST API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vendornest_backend
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=django-insecure-docker-vendornest-secret-key-2026
      - DJANGO_SECRET_KEY=django-insecure-docker-vendornest-secret-key-2026
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - DJANGO_ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/vendornest_db
      - DB_SSL_REQUIRE=False
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USE_TLS=True
      - EMAIL_HOST_USER=eng.tuhin77@gmail.com
      - EMAIL_HOST_PASSWORD=yhfcmcefypwxschm
      - DEFAULT_FROM_EMAIL=eng.tuhin77@gmail.com
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Celery Background Worker Service
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vendornest_celery
    restart: always
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=django-insecure-docker-vendornest-secret-key-2026
      - DJANGO_SECRET_KEY=django-insecure-docker-vendornest-secret-key-2026
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/vendornest_db
      - DB_SSL_REQUIRE=False
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USE_TLS=True
      - EMAIL_HOST_USER=eng.tuhin77@gmail.com
      - EMAIL_HOST_PASSWORD=yhfcmcefypwxschm
      - DEFAULT_FROM_EMAIL=eng.tuhin77@gmail.com
    depends_on:
      - backend
      - redis

volumes:
  postgres_data:
    driver: local
