services:
  # 1. Redis Cache & Celery Broker Container
  redis:
    image: redis:7-alpine
    container_name: vendornest_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Django Backend REST API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vendornest_backend
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - .:/app
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-vendornest-secret-key-2026}
      - DJANGO_SECRET_KEY=${SECRET_KEY:-django-insecure-docker-vendornest-secret-key-2026}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=*
      - DJANGO_ALLOWED_HOSTS=*
      - DATABASE_URL=${DATABASE_URL}
      - DB_SSL_REQUIRE=${DB_SSL_REQUIRE:-True}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      redis:
        condition: service_healthy

  # 3. Celery Background Worker Service
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vendornest_celery
    restart: always
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-vendornest-secret-key-2026}
      - DJANGO_SECRET_KEY=${SECRET_KEY:-django-insecure-docker-vendornest-secret-key-2026}
      - DATABASE_URL=${DATABASE_URL}
      - DB_SSL_REQUIRE=${DB_SSL_REQUIRE:-True}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      - backend
      - redis
